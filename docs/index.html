<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Desarrollo de Carrera · Appgate</title>
<meta name="description" content="Evaluación por cargo y planes de desarrollo.">

<!-- Tipografías servidas desde el propio sitio: ninguna petición a terceros.
     Este archivo no contiene datos de nadie; todo llega del flujo tras entrar. -->
<link rel="stylesheet" href="styles/fuentes-incrustadas.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/mvp.css">
<link rel="stylesheet" href="styles/graficas.css">
<link rel="stylesheet" href="styles/admin.css">
<link rel="stylesheet" href="styles/ayuda.css">
</head>
<body>

<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="app-header">
  <div class="container app-header__inner">
    <a class="app-header__brand" href="#/">
      <span class="app-header__mark" aria-hidden="true">DC</span>
      <span>Desarrollo de Carrera</span>
    </a>
    <nav class="app-nav" id="nav" aria-label="Secciones"></nav>
    <!-- Ayuda en todas las pantallas, también antes de entrar: la duda llega
         en cualquier momento, y buscarla no puede costar más que tenerla. -->
    <div class="ayuda-menu" id="ayuda">
      <button type="button" class="btn btn--ghost btn--sm ayuda-menu__boton" id="btn-ayuda"
              aria-expanded="false" aria-controls="ayuda-panel"></button>
      <div class="ayuda-menu__panel" id="ayuda-panel" hidden></div>
    </div>
    <div class="usuario" id="usuario" hidden></div>
  </div>
</header>

<main id="contenido" class="container page" tabindex="-1">
  <div class="skeleton skeleton--kpi" aria-hidden="true"></div>
  <p class="sr-only" role="status">Cargando…</p>
</main>

<footer class="app-footer">
  <div class="container app-footer__inner">
    <span id="pie-ronda"></span>
    <span id="pie-ayuda"></span>
  </div>
</footer>

<script type="module">
import { icon, esc, toast, withBusy, confirmar, emptyState } from './lib/ui.js';
import { ocultarTooltip } from './lib/graficas.js';
import {
  iniciar, sesion, salir, ronda, ROLES, pendientes, descartarSesion, borradoresSinEnviar,
} from './lib/almacen.js';
import { ruta, configurar, iniciarRuteo, ir, resolver } from './lib/ruteo.js';
import { iniciarRecorrido, cerrarRecorrido, hayRecorrido, yaVioRecorrido, claveDe } from './lib/recorrido.js';
import { CORREO_AYUDA } from './config.js';
import { vistaAyuda, vistaAyudaAdmin } from './vistas/ayuda.js';

import { vistaEntrar } from './vistas/entrar.js';
import { vistaInicio } from './vistas/inicio.js';
import { vistaMiDesarrollo, vistaPersona } from './vistas/perfil.js';
import { vistaEvaluar } from './vistas/evaluar.js';
import { vistaEquipo } from './vistas/equipo.js';
import { vistaPlan } from './vistas/plan.js';
import { vistaCatalogo } from './vistas/catalogo.js';
import { vistaOrganizacion } from './vistas/organizacion.js';
import {
  vistaAdminPersonas, vistaAdminEquipos, vistaAdminCargos, vistaAdminPares,
  vistaAdminAuditoria, vistaAdminRonda,
} from './vistas/admin.js';

const el = (id) => document.getElementById(id);

/* ------------------------------------------------------------------- rutas */

ruta('#/entrar', vistaEntrar, { publica: true });
ruta('#/', vistaInicio);
ruta('#/mi-desarrollo', vistaMiDesarrollo, { requiere: 'cargo' });
ruta('#/autoevaluacion', ({ sesion: s }) => vistaEvaluar({ sesion: s, params: { id: s.persona.id } }),
     { requiere: 'cargo' });
ruta('#/evaluar/:id', vistaEvaluar);
ruta('#/equipo', vistaEquipo, { rol: 'lider' });
ruta('#/persona/:id', vistaPersona);
ruta('#/plan/:id', vistaPlan);
ruta('#/organizacion', vistaOrganizacion, { rol: 'admin' });
ruta('#/admin/catalogo', vistaCatalogo, { rol: 'admin' });
ruta('#/admin/personas', vistaAdminPersonas, { rol: 'admin' });
ruta('#/admin/equipos', vistaAdminEquipos, { rol: 'admin' });
ruta('#/admin/cargos', vistaAdminCargos, { rol: 'admin' });
ruta('#/admin/pares', vistaAdminPares, { rol: 'admin' });
ruta('#/admin/auditoria', vistaAdminAuditoria, { rol: 'admin' });
ruta('#/admin/ronda', vistaAdminRonda, { rol: 'admin' });
// El manual se abre con o sin sesión: quien todavía no entra también puede tener dudas.
ruta('#/ayuda', vistaAyuda, { abierta: true });
ruta('#/ayuda/:seccion', vistaAyuda, { abierta: true });
ruta('#/ayuda-admin', vistaAyudaAdmin, { rol: 'admin' });
ruta('#/ayuda-admin/:seccion', vistaAyudaAdmin, { rol: 'admin' });
// Un enlace viejo o mal escrito llega acá: con título y salida, no una línea suelta.
ruta('#/404', () => `
  <div class="page-header"><h1 class="page-header__title">Esta página no existe</h1></div>
  ${emptyState({ title: 'El enlace está mal o la página cambió de lugar', body: 'Vuelve al inicio para seguir desde ahí.', glyph: 'help' })}
  <p><a class="btn btn--secondary" href="#/">Ir al inicio</a></p>`);

/* --------------------------------------------------------------- navegación */

/**
 * El menú se arma según lo que la persona puede hacer. Un enlace que lleva a
 * una pantalla sin permiso es peor que no tenerlo: enseña a desconfiar del menú.
 * (Y no es seguridad: el servidor no entrega lo que no corresponde.)
 */
function enlacesDe(s) {
  const enlaces = [{ href: '#/', label: 'Inicio' }];
  const roles = s.persona.roles;
  const yo = s.persona.id;
  if (s.persona.cargo_id) {
    enlaces.push({ href: '#/mi-desarrollo', label: 'Mi desarrollo', prefijo: ['#/autoevaluacion', `#/plan/${yo}`] });
  }
  // Las pantallas de una persona del equipo (perfil, evaluación, plan) son de
  // «Mi equipo»: sin esto, ningún enlace del menú decía dónde se estaba.
  if (roles.includes('lider')) {
    enlaces.push({ href: '#/equipo', label: 'Mi equipo', prefijo: ['#/persona/', '#/evaluar/', '#/plan/'], excepto: [`#/plan/${yo}`, `#/persona/${yo}`] });
  }
  if (roles.includes('admin')) {
    enlaces.push({ href: '#/organizacion', label: 'Organización' });
    enlaces.push({ href: '#/admin/personas', label: 'Administración', prefijo: ['#/admin/'] });
  }
  return enlaces;
}

/** 'page' si es exactamente esta pantalla; 'true' si es una de su sección. */
function actual(l, hash) {
  if (hash === l.href) return 'page';
  if ((l.excepto ?? []).includes(hash)) return null;
  return (l.prefijo ?? []).some((p) => hash.startsWith(p)) ? 'true' : null;
}

/* ------------------------------------------------------------------- ayuda */

function pintarAyuda() {
  const s = sesion();
  const hash = location.hash || '#/';
  const admin = s?.persona.roles.includes('admin');
  const conRecorrido = s && hayRecorrido(hash);
  const html = `
    <ul class="ayuda-menu__lista">
      ${conRecorrido ? `<li><button type="button" class="ayuda-menu__item" data-recorrido>${icon('compass')}<span>Visita guiada de esta pantalla</span></button></li>` : ''}
      <li><a class="ayuda-menu__item" href="#/ayuda">${icon('book')}<span>Manual de uso</span></a></li>
      ${admin ? `<li><a class="ayuda-menu__item" href="#/ayuda-admin">${icon('database')}<span>Manual de administración</span></a></li>` : ''}
      <li class="ayuda-menu__separador"><a class="ayuda-menu__item" href="mailto:${esc(CORREO_AYUDA)}">${icon('mail')}
        <span>Escribir a Personas<span class="ayuda-menu__detalle">${esc(CORREO_AYUDA)}</span></span></a></li>
    </ul>`;
  // Sin repintar si nada cambió: con el menú abierto, repintar perdía el foco.
  if (el('ayuda-panel').dataset.html !== html) { el('ayuda-panel').innerHTML = html; el('ayuda-panel').dataset.html = html; }
  if (!el('btn-ayuda').innerHTML) el('btn-ayuda').innerHTML = `${icon('help')}<span>Ayuda</span>`;
  el('pie-ayuda').innerHTML = `¿Dudas? <a href="#/ayuda">Manual de uso</a> · <a href="mailto:${esc(CORREO_AYUDA)}">${esc(CORREO_AYUDA)}</a>`;
}

function abrirAyuda(abrir) {
  el('btn-ayuda').setAttribute('aria-expanded', String(abrir));
  el('ayuda-panel').hidden = !abrir;
}

el('btn-ayuda').addEventListener('click', () => abrirAyuda(el('ayuda-panel').hidden));
el('ayuda-panel').addEventListener('click', (e) => {
  if (e.target.closest('[data-recorrido]')) {
    abrirAyuda(false);
    // El foco vuelve al botón Ayuda al terminar: el ítem del menú ya no está visible.
    if (!iniciarRecorrido({ volverA: el('btn-ayuda') })) {
      toast('Esta pantalla no tiene nada que explicar en este momento. El manual de uso está en Ayuda.', 'info');
      el('btn-ayuda').focus();
    }
  } else if (e.target.closest('a')) abrirAyuda(false);
});
// Escape, un clic fuera o el foco saliendo del menú lo cierran: abierto, tapaba
// lo que venía después.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !el('ayuda-panel').hidden) { abrirAyuda(false); el('btn-ayuda').focus(); }
});
document.addEventListener('click', (e) => { if (!el('ayuda').contains(e.target)) abrirAyuda(false); });
el('ayuda').addEventListener('focusout', (e) => { if (e.relatedTarget && !el('ayuda').contains(e.relatedTarget)) abrirAyuda(false); });

// Un solo temporizador para la visita automática: si la persona cambia de
// pantalla antes de que arranque, se cancela.
let visitaProgramada = 0;
function programarVisita(hash, opciones) {
  clearTimeout(visitaProgramada);
  visitaProgramada = setTimeout(() => {
    if ((location.hash || '#/') !== hash || document.querySelector('dialog[open]')) return;
    iniciarRecorrido({ hash, ...opciones });
  }, 600);
}

function pintarCarcasa() {
  const s = sesion();
  el('pie-ronda').textContent = s && ronda() ? `Ronda ${ronda().nombre}${ronda().abierta ? '' : ' · cerrada'}` : '';
  pintarAyuda();

  if (!s) {
    el('nav').innerHTML = '';
    el('usuario').hidden = true;
    return;
  }

  const abiertas = pendientes(s.persona.id).length;
  const hash = location.hash || '#/';

  el('nav').innerHTML = enlacesDe(s).map((l) => `
    <a class="app-nav__link" href="${l.href}"
       ${actual(l, hash) ? `aria-current="${actual(l, hash)}"` : ''}>${esc(l.label)}</a>`).join('');

  el('usuario').hidden = false;
  el('usuario').innerHTML = `
    <span class="usuario__nombre">
      ${esc(s.persona.nombre)}
      <span class="usuario__rol">${esc(
        s.persona.roles.map((r) => ROLES[r]?.label).filter(Boolean).join(' · '))}</span>
    </span>
    ${abiertas ? `<a class="badge badge--warning usuario__pendientes" href="#/">${abiertas} pendiente${abiertas === 1 ? '' : 's'}</a>` : ''}
    <button type="button" class="btn btn--ghost btn--sm" id="btn-salir">Salir</button>`;

  el('btn-salir').addEventListener('click', async (ev) => {
    const boton = ev.currentTarget;
    const n = borradoresSinEnviar();
    if (n && !(await confirmar({
      titulo: n === 1 ? 'Tienes una evaluación sin enviar' : `Tienes ${n} evaluaciones sin enviar`,
      cuerpo: 'Al salir se borran las respuestas que no enviaste de este navegador. Si quieres seguir después, cierra la pestaña en lugar de salir.',
      aceptar: 'Salir y borrar', cancelar: 'Seguir evaluando', peligro: true,
    }))) return;
    await withBusy(boton, () => salir(), { label: 'Saliendo…' });
    ir('#/entrar');
    pintarCarcasa();
  });
}

/* ---------------------------------------------------------------- arranque */

configurar({
  montarEn: el('contenido'),

  // Guardas en un solo lugar. Ninguna vista consulta la sesión ni decide si
  // hay permiso: llega resuelto o no llega.
  alEntrar(r) {
    const s = sesion();
    // Una visita abierta no sobrevive a un cambio de pantalla.
    clearTimeout(visitaProgramada);
    cerrarRecorrido();
    abrirAyuda(false);
    if (r.abierta) return { sesion: s };
    if (!s) return r.publica ? {} : { redirigir: '#/entrar' };
    if (r.publica) return { redirigir: '#/' };
    if (r.rol && !s.persona.roles.includes(r.rol)) return { redirigir: '#/' };
    if (r.requiere === 'cargo' && !s.persona.cargo_id) return { redirigir: '#/' };
    return { sesion: s };
  },

  alSalir() {
    ocultarTooltip();
    pintarCarcasa();
    const s = sesion();
    const hash = location.hash || '#/';
    // «Ir a hacerlo, con visita guiada» desde el manual: arranca al llegar, solo
    // si se llegó a la pantalla pedida (una redirección no hereda la visita).
    let pedida = null;
    try { pedida = sessionStorage.getItem('cdp.recorrido-pendiente'); sessionStorage.removeItem('cdp.recorrido-pendiente'); } catch { /* sin visita */ }
    if (s && pedida && claveDe(pedida) === claveDe(hash)) { programarVisita(hash, {}); return; }
    // La primera vez que alguien entra, la visita de Inicio arranca sola.
    // Después se repite desde Ayuda, cuando la persona quiera.
    if (s && hash === '#/' && !yaVioRecorrido(s.persona.id)) programarVisita(hash, { usuario: s.persona.id });
  },
});

document.addEventListener('cdp:cambio', pintarCarcasa);

// El servidor dijo que la sesión venció (o la cerraron desde administración).
// Puede llegar de varias peticiones a la vez: se atiende una sola. Se cierra
// cualquier diálogo abierto —si no, queda encima del ingreso, inerte— y se
// recuerda dónde estaba la persona para volver ahí al entrar.
let terminando = false;
document.addEventListener('cdp:sesion-terminada', () => {
  if (terminando) return;
  terminando = true;
  document.querySelectorAll('dialog[open]').forEach((d) => d.close());
  const donde = location.hash;
  if (donde && donde !== '#/entrar') {
    try { sessionStorage.setItem('cdp.volver-a', donde); } catch { /* se vuelve al inicio */ }
  }
  descartarSesion();
  pintarCarcasa();
  try { sessionStorage.setItem('cdp.sesion-vencida', '1'); } catch { /* el ingreso no lo menciona */ }
  ir('#/entrar');
  setTimeout(() => { terminando = false; }, 1000);
});

// El cambio se guardó pero la vista no se pudo actualizar (red, límite).
document.addEventListener('cdp:recarga-fallida', () => {
  toast('El cambio quedó guardado, pero la pantalla no se pudo actualizar. Recarga la página para ver lo último.', 'info', { timeout: 0 });
});

iniciar().then(() => {
  pintarCarcasa();
  iniciarRuteo();
}).catch((error) => {
  console.error(error);
  el('contenido').innerHTML = `
    <div class="callout callout--danger" role="alert">
      ${icon('alert')}
      <span>No se pudo conectar con el servidor. ${esc(error.message ?? '')}</span>
    </div>
    <button type="button" class="btn btn--secondary" id="reintentar">Reintentar</button>`;
  el('reintentar').addEventListener('click', () => location.reload());
});

// Tras un cambio de administración el dato se recargó: se repinta la pantalla
// actual con él, sin perder el lugar ni el foco.
document.addEventListener('cdp:cambio', (e) => { if (e.detail?.que === 'recarga') resolver({ conservar: true }); });
</script>
</body>
</html>
